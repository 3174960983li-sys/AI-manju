<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>映序 · AI短剧工作台</title><link rel="stylesheet" href="/style.css"></head>
<body><aside class="sidebar"><a class="brand" href="/">映序<span>STORY TO SCREEN</span></a><div class="workspace-label">个人制作空间 <span class="live-dot"></span></div><button class="nav active" id="nav-projects">◫　项目工作台</button><button class="nav" id="nav-docs">▤　制作规范库</button><div class="sidebar-bottom"><span class="tag">LOCAL · V0.3</span><p>从一个想法<br>到一部完整作品。</p><small>数据存于本机 · 未接入生成平台</small></div></aside>
<main><header><div><span class="eyebrow">PRODUCTION WORKSPACE</span><h1 id="page-title">项目工作台</h1></div><div class="header-actions"><span id="save-status" role="status">正在连接本地数据…</span><button id="import-btn" class="button secondary">导入</button><button id="export-btn" class="button secondary">导出</button><button id="new-btn" class="button primary">＋ 新建项目</button><input id="import-file" type="file" accept="application/json,.json" hidden></div></header>
<div id="error" role="alert" hidden></div><section id="content" aria-live="polite"></section>
<footer>映序 / AI 短剧 Agent 与 SOP 全流程 <span>创作 · 制作 · 完成</span></footer></main>
<dialog id="project-dialog"><form id="project-form"><div class="dialog-top"><span class="eyebrow">NEW PRODUCTION</span><button type="button" id="close-dialog" class="icon-btn" aria-label="关闭">×</button></div><h2>从一个新想法开始</h2><p class="muted">先记录构想，制作规格可以在后续阶段继续完善。</p><label>项目名称<input name="title" maxlength="120" placeholder="为你的作品起个名字" required></label><div class="form-row"><label>题材<input name="genre" placeholder="例如：悬疑 / 都市 / 古装"></label><label>形式<input name="format" value="竖屏仿真人连续短剧"></label></div><label>创作目标<textarea name="goal" rows="3" placeholder="你希望观众获得什么体验？希望作品实现什么？"></textarea></label><label>目标受众<input name="audience" placeholder="尚不确定也可以留空"></label><div class="dialog-actions"><button class="button primary" type="submit">创建项目 →</button></div></form></dialog>
<dialog id="decision-dialog"><form id="decision-form"><span class="eyebrow">YOUR DECISION</span><h2 id="decision-title">确认操作</h2><p id="decision-description" class="muted"></p><label id="decision-label">补充说明<input id="decision-note" maxlength="2000"></label><div class="dialog-actions"><button type="button" class="button secondary" id="decision-cancel">取消</button><button type="submit" class="button primary">确认</button></div></form></dialog><script type="module" src="/app.js"></script></body></html>
